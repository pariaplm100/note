{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'forgot_password.css' %}">
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        .container{
            height:340px;
        }

        .cancel-text{
            display:inline-block;
            width:auto;
            align-items:center;
            justify-content:center;
            position:relative;
            border-radius:8px;
            text-decoration:none !important;
            padding:5px 18px;
            top:330px;
            right:-5px;
            font-weight:bold;
            color:#fff !important;
            background:#4b90e2 !important;
        }

        .cancel-text:hover{
            background:#2b5f93;
            transform:translateY(-2px);
}
</style>
</head>
<body>
{% if messages %}
<div id="toast-container">
    {% for message in messages %}
        <div class="toast {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}    

<div class="container">
    
    <a href="{% url 'accounts:login_page' %}" class='cancel-text'>Cancel 
    </a>
    
    
    <div class="title">
        Forgot Password
    </div>

    <form method="POST">
        {% csrf_token %}

        <p class="text">
            Enter your username.
            <br>
            We'll send a verification code
            to your registered email.
        </p>

        <input type="text" name="username" placeholder="Username" required>

        <button class="btn">
            Send Code
        </button>

    </form>

</div>
<script>
setTimeout(() => {
    document.querySelectorAll(".toast").forEach(msg => {
        msg.style.opacity = "0";
        msg.style.transform = "translateX(100px)";
        setTimeout(() => {msg.remove();}, 500);
    });
}, 3000);
</script>

</body>
</html>
