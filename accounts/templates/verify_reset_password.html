{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'verify_reset_password.css' %}">
    <meta charset="UTF-8">
    <title>Verify Code</title>
</head>
<body>

{% if messages %}
<div id="toast-container">
    {% for message in messages %}
        <div class="toast {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}    

<a href="javascript:history.back()" class="back-btn">←</a>

<div class="container">

    <div class="title">
        Verify Code
    </div>

    <form method="POST">

        {% csrf_token %}

        <p class="verify-text">
            Verification code sent to
            <br>
            <span>{{ email }}</span>
        </p>

        <input
            type="text"
            name="otp"
            maxlength="6"
            placeholder="Enter Code"
            class="otp-input"
            required>

        <button class="btn">
            Verify
        </button>

    </form>

</div>
<script>
setTimeout(() => {
    document.querySelectorAll(".toast").forEach(msg => {
        msg.style.opacity = "0";
        msg.style.transform = "translateX(100px)";
        setTimeout(() => {msg.remove();}, 500);
    });
}, 3000);
</script>
</body>
</html>
