{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'reset_password.css' %}">
    <meta charset="UTF-8">
    <title>Reset Password</title>
</head>

{% if messages %}
<div id="toast-container">
    {% for message in messages %}
        <div class="toast {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

<body>
  
<div class="container">
    
     <a href="{% url 'accounts:login_page' %}" class='back-to-login'> <span>Back to Login </span> 
    </a>


    <div class="title">
        New Password
    </div>

    <form method="POST">

        {% csrf_token %}

        <input type="password" name="password1" placeholder="New Password" required>

        <input type="password" name="password2" placeholder="Confirm Password" required>

        <button class="btn">
            Change Password
        </button>

    </form>

</div>
<script>
setTimeout(() => {
    document.querySelectorAll(".toast").forEach(msg => {
        msg.style.opacity = "0";
        msg.style.transform = "translateX(100px)";
        setTimeout(() => {msg.remove();}, 500);
    });
}, 3000);
</script>

</body>
</html>
