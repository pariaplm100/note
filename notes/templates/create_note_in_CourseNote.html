<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Note</title>

    <link rel="stylesheet" href="{% static 'create_note_in_CourseNote.css' %}">
</head>

<body>

<div class="container">

    <h1 class="title">Add New Note</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Course Name</label>

        <input
            type="text"
            name="course_name"
            class="text-input"
            placeholder="Course Name"
            required>

        <label>Note</label>

        <textarea
            name="topic"
            class="text-area"
            placeholder="Write your note..."
            required></textarea>

        <label>Upload Files</label>

        <input
            type="file"
            name="files"
            multiple>

        <div class="buttons">

            <a href="{% url 'notes:Course_Notes' %}" class="cancel-btn">
                Cancel
            </a>

            <button type="submit" class="save-btn">
                Save Note
            </button>

        </div>

    </form>

</div>

</body>
</html>
