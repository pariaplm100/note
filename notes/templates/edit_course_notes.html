{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Note</title>

    <link rel="stylesheet" href="{% static 'edit_course_notes.css' %}">

</head>

<body>

<div class="container">

    <h1 class="title">
        Edit Course & Note
    </h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Course Name</label>

        <input
            type="text"
            name="course_name"
            class="text-input"
            value="{{ note.course.name }}"
            required>

        <label>Note</label>

        <textarea
            name="topic"
            class="text-area"
            required>{{ note.topic }}</textarea>


        <h3 class="files-title">
            Uploaded Files
        </h3>

        <div class="files-list">

            {% for file in note.files.all %}

                <div class="file-item">

                    <span>
                        📄 {{ file.file.name|cut:"notes_files/" }}
                    </span>

                    <button type="button" class="delete-file" onclick="deleteFile( {{ file.id }} )">
                        Delete
                    </button>    

                </div>

            {% empty %}

                <p class="empty">
                    No uploaded files.
                </p>

            {% endfor %}

        </div>


        <label>Add New Files</label>

        <input type="file" name="files" multiple>


        <div class="buttons">

            <a
                href="{% url 'notes:Course_Notes' %}"
                class="cancel-btn">

                Cancel

            </a>


            <button
                type="submit"
                class="save-btn">

                Save Changes

            </button>

        </div>

    </form>

</div>

<script>

function deleteFile(id){

    if(!confirm("Are you sure you want to delete this file?")){
        return;
    }

    fetch(`/delete-file/${id}/`, {

        method: "POST",

        headers:{
            "X-CSRFToken": "{{ csrf_token }}"
        }

    })

    .then(response => response.json())

    .then(data => {

        if(data.success){

            location.reload();

        }
        else{

            alert("File could not be deleted");

        }

    })

}

</script>

</body>
</html>
