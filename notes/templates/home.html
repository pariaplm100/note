{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Note</title>
    <link rel="stylesheet" href="{% static 'home.css' %}">
</head>
<body>
    <div class="container">
        <!--Header-->
        <header class="page-header">
            <nav class="navbar">
                 {% if request.user.is_authenticated %}
                <a href="{% url 'notes:profile' %}" class="item-navbar active">
                    <span>Profile</span><br>
                    <span class="username">
                    {{request.user.username}}
                </span>
                </a>
                {% endif %}
                
                <a href="" class="item-navbar active">setting</a>
                {% if not request.user.is_authenticated %}
                <a href="{% url 'login_page' %}" class="item-navbar active">Sign up | Login</a>
                {% else %}
                <p></p>
                {% endif %}

                <a href="{% url 'notes:AboutUs' %}" class="item-navbar active">About us</a>
                <a href="{% url 'notes:ContactUs' %}" class="item-navbar active">Contact Us</a>
            </nav>
            <h1>Class Notes</h1>
        </header>
        <!--toolbar-->
        <section class="toolbar">

            <div class="right">
                <input type="text" placeholder="Search"/>
                <button type="button" class="new" id="newBtn">+ New</button>
            </div>
        </section>
        <!--Table-->
        <section class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>Number</th>
                        <th>Name</th>
                        <th>Notes</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </section>
    </div>
<script src="{% static 'js/script.js' %}"></script>
<!--پنجره برای دیدن و انتخاب فایل و جزوات درسی-->
    <div id="noteModal" class="modal">
        <div class="modal-content">

            <span id="closeModal" class="close-btn">&times;</span>

            <h2 id="modalLesson"></h2>

            <p id="modalNote"></p>

            <div class="file-section">
                <label>Select File:</label>
                <input type="file" id="fileInput">
            </div>

            <button id="closeButton">Close</button>

        </div>
    </div>
</body>
</html>
